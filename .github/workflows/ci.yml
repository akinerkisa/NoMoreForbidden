name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
          pip install build
      - name: Fetch local training lab
        run: |
          git clone --depth 1 https://github.com/akinerkisa/renikApp.git renikApp
          test -f renikApp/run_dev.py
          test -f renikApp/tests/test_403_scenarios.py
          pip install -r renikApp/requirements.txt
      - name: Run lint
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Build package
        run: python -m build
      - name: Smoke CLI
        run: |
          nmf --version
          python -m nomoreforbidden --version
          python nmf.py --version
          python nmf.py -u https://example.com/x --only nmf --dry-run --output-format json | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('dry_run') is True"
