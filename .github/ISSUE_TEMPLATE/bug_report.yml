name: Bug report
description: Report a reproducible problem in authorized or local testing.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private target data, or undisclosed findings.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: "Python 3.12 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use a renikApp route or sanitized target shape.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and expected behavior
    validations:
      required: true
