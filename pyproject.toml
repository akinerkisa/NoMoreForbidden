[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nomoreforbidden"
dynamic = ["version"]
description = "CLI tool for 403 bypass techniques."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "NoMoreForbidden contributors"}]
keywords = ["403", "access-control", "bug-bounty", "pentesting", "security-testing", "waf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.28.0",
  "urllib3>=2.0.0",
  "httpx",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.12.0",
  'tomli>=2.0.1; python_version < "3.11"',
]

[project.scripts]
nmf = "nomoreforbidden.cli:run_cli"

[project.urls]
Homepage = "https://github.com/akinerkisa/NoMoreForbidden"
Repository = "https://github.com/akinerkisa/NoMoreForbidden"
Issues = "https://github.com/akinerkisa/NoMoreForbidden/issues"
Changelog = "https://github.com/akinerkisa/NoMoreForbidden/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["nomoreforbidden*"]

[tool.setuptools.dynamic]
version = {attr = "nomoreforbidden._version.VERSION"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: local HTTP integration with renikApp (requires Flask)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["renikApp"]

[tool.ruff.lint]
select = ["E", "F", "I"]
